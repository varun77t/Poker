# Render Blueprint: one web service that serves the built client, the REST endpoints and Socket.IO.
# See docs/deployment.md. Games live in memory, so this must stay a single instance.
services:
  - type: web
    name: private-holdem
    runtime: node
    # "free" sleeps after about 15 minutes without visitors (the next visit takes about a minute to
    # wake it, and a sleep ends any game). "starter" stays up; change it here or in the dashboard.
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    autoDeploy: true
    envVars:
      # Render requests pass three proxies (Cloudflare's edge, then two Render proxies), measured on the
      # live service. Trusting exactly three makes the per-IP limits see each visitor's real address,
      # and a forged X-Forwarded-For entry cannot move it. See docs/deployment.md.
      - key: TRUST_PROXY
        value: "3"
      - key: LOG_LEVEL
        value: info
